name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/extension/**'
      - 'bun.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# One deploy at a time, so an older build never lands after a newer one.
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      CLOUDFLARE_ACCOUNT_ID: 5e565cf9fa55b0eae1f8131903da2ca9
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - run: bun run typecheck
      - run: bun test
      - uses: ./.github/actions/wait-for-ci
      - run: bun run deploy
        env:
          # The token the site deploys with; the Custom Domain `docs.ruimte.app` sits on the same zone.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
