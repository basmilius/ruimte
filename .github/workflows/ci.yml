name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only a pull request gives way to its next push. Every commit on main keeps a run of its own, since
# a deploy or a release waits on the run of the commit it ships.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Rust and Swift checks, each only when its paths changed; a release runs them all on its tag.
  native:
    uses: ./.github/workflows/native.yml
    permissions:
      contents: read

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - run: bun run check:types
      - run: bun run lint
      - run: bun run format:check

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - uses: ./.github/actions/cache-react-compiler
      - run: bun run check:generated
      # verify owns the client's typecheck; public builds still run tsc -b before bundling.
      - run: bun run --cwd apps/client build:bundle
      - run: bun run --cwd apps/desktop build
      # Station and Bench otherwise build first after a release is published, when they deploy. Only their
      # bundles: `tsc -b` costs minutes per build here, and `verify` already checks the types.
      - run: bun run --cwd apps/client bundle:station
      - run: bun run --cwd apps/client bundle:bench
      # The unit shards run on Linux; a case-insensitive volume is what only a Mac has under these tests.
      - run: bun test --conditions=source apps/server/src/fs

  unit:
    name: unit (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - run: bun run test --shard=${{ matrix.shard }}/2

  # On the same switch as the Windows release (WINDOWS_RELEASE).
  windows:
    name: unit (Windows)
    if: vars.WINDOWS_RELEASE == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - run: bun run lint
      # Two workers instead of one per core, and without the test files that run git: windows-ci.bunfig.toml says why.
      - run: bun --config=windows-ci.bunfig.toml test --conditions=source --parallel=2 --no-isolate --only-failures

  dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - uses: ./.github/actions/cache-react-compiler
      - run: bun run test:dom

  integration:
    name: integration (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - run: bun run test:integration --suite core

  packaged:
    name: packaged (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Release tags can restore main's cache, but cannot restore another tag's cache.
      - uses: ./.github/actions/cache-native-builds
      - uses: ./.github/actions/install
      - run: bun run test:package

  integration-linux:
    name: integration (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The shell tests start /bin/zsh, which the runner image does not promise.
      # Only when it is missing, and with retries: the runner's package mirrors go unreachable now and then.
      - run: command -v zsh || (sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends zsh)
      # The runner image makes /usr/share world-writable, and Ubuntu's global zshrc then stops on compinit's prompt.
      - run: zsh -fc 'autoload -Uz compaudit; compaudit' 2>/dev/null | sort -u | xargs -r sudo chmod go-w
      - uses: ./.github/actions/install
      - run: bun run test:integration --suite core

  # The release's own Linux runner, so the compiled daemon is proven on the glibc floor it claims.
  packaged-linux:
    name: packaged (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - run: bun run test:package

  # A pull request runs the Docker suite only when what the image holds or the suite reaches changed.
  docker-changes:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.paths.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: paths
        with:
          token: ''
          filters: |
            docker:
              - '.github/workflows/ci.yml'
              - 'bun.lock'
              - 'apps/server/**'
              - 'apps/pulsar-broker/**'
              - 'packages/contracts/**'
              - 'packages/pulsar/**'

  # The daemon in a Linux container, reached the way another machine reaches it: the owner boundary
  # and the door on the local network end to end (apps/server/docker/README.md).
  docker:
    name: docker (Linux)
    needs: docker-changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.docker-changes.outputs.docker == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - run: bun run --cwd apps/server docker:test

  # A pull request builds the site only when what it renders changed; site.yml deploys it after main's run.
  site-changes:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.paths.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: paths
        with:
          token: ''
          filters: |
            site:
              - '.github/workflows/ci.yml'
              - 'bun.lock'
              - 'apps/site/**'
              - 'packages/extension/**'

  # The site's typecheck and tests already run in verify and unit; a page that fails to compile or
  # prerender shows only in the build.
  site:
    name: site build
    needs: site-changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.site-changes.outputs.site == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - run: bun run --cwd apps/site build

  checks:
    name: CI checks
    if: ${{ always() }}
    needs: [native, verify, build, unit, windows, dom, integration, packaged, integration-linux, packaged-linux, docker-changes, docker, site-changes, site]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'all(.[]; . == "success" or . == "skipped")' <<< "$RESULTS"
