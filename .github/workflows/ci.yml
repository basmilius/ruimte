name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these jobs on the tagged commit, so a red one keeps the draft from being published.
  workflow_call:
    inputs:
      full:
        description: Run all native checks regardless of changed paths
        type: boolean
        default: true

# Only a pull request gives way to its next push. Every commit on main and every tag keeps a run of
# its own, since a deploy waits on the run of the commit it ships.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: ${{ !inputs.full }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      swift_pulsar: ${{ steps.paths.outputs.RuimtePulsar }}
      swift_transport: ${{ steps.paths.outputs.RuimteTransport }}
      computer_use: ${{ steps.paths.outputs.computer_use }}
      foundation_models: ${{ steps.paths.outputs.foundation_models }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: paths
        with:
          # Git detection also works for fork PRs without pull-requests permission in callers.
          token: ''
          filters: |
            rust:
              - '.github/**'
              - 'apps/ios-device-bridge/**'
              - 'apps/context-launcher/**'
            RuimtePulsar:
              - '.github/**'
              - 'apps/ios/Packages/RuimtePulsar/**'
            RuimteTransport:
              - '.github/**'
              - 'apps/ios/Packages/RuimtePulsar/**'
              - 'apps/ios/Packages/RuimteTransport/**'
            computer_use:
              - '.github/**'
              - 'apps/computer-use/**'
            foundation_models:
              - '.github/**'
              - 'apps/foundation-models/**'

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - run: bun run lint
      - run: bun run format:check

  typecheck:
    name: typecheck (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [client, server, scripts, workspaces]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - name: Check types
        env:
          GROUP: ${{ matrix.group }}
        run: |
          case "$GROUP" in
            client|server) bun run --cwd "apps/$GROUP" typecheck ;;
            scripts) bun x tsc -p tsconfig.scripts.json ;;
            workspaces) bun run --filter '*' --filter '!@ruimte/client' --filter '!@ruimte/server' typecheck ;;
          esac

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - uses: ./.github/actions/cache-react-compiler
      - run: bun run check:generated
      # typecheck owns client tsc -b; public builds still typecheck before bundling.
      - run: bun run --cwd apps/client build:bundle
      - run: bun run --cwd apps/desktop build
      # The unit shards run on Linux; a case-insensitive volume is what only a Mac has under these tests.
      - run: bun test --conditions=source apps/server/src/fs

  unit:
    name: unit (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - run: bun run test --shard=${{ matrix.shard }}/4

  # On the same switch as the Windows release (WINDOWS_RELEASE).
  windows:
    name: unit (Windows, ${{ matrix.shard }}/9)
    if: vars.WINDOWS_RELEASE == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      # Two workers instead of one per core: the tests that run git start dozens of processes each, and
      # four files doing that at once on this runner pushed them past Bun's five seconds.
      - run: bun test --conditions=source --parallel=2 --only-failures --timings=test-timings.json --shard=${{ matrix.shard }}/9

  dom:
    name: dom (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - uses: ./.github/actions/cache-react-compiler
      - run: bun run test:dom --shard=${{ matrix.shard }}/3

  integration:
    name: integration (macOS, ${{ matrix.shard }}/3)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - run: bun run test:integration --suite core --shard=${{ matrix.shard }}/3

  packaged:
    name: packaged (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Release tags can restore main's cache, but cannot restore another tag's cache.
      - uses: ./.github/actions/cache-native-builds
      - uses: ./.github/actions/install
      - run: bun run test:package

  integration-linux:
    name: integration (Linux, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The shell tests start /bin/zsh, which the runner image does not promise.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      # The runner image makes /usr/share world-writable, and Ubuntu's global zshrc then stops on compinit's prompt.
      - run: zsh -fc 'autoload -Uz compaudit; compaudit' 2>/dev/null | sort -u | xargs -r sudo chmod go-w
      - uses: ./.github/actions/install
      - run: bun run test:integration --suite core --shard=${{ matrix.shard }}/3

  # The release's own Linux runner, so the compiled daemon is proven on the glibc floor it claims.
  packaged-linux:
    name: packaged (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - run: bun run test:package

  rust:
    needs: changes
    if: ${{ !cancelled() && (inputs.full || needs.changes.outputs.rust == 'true') }}
    runs-on: macos-latest
    strategy:
      matrix:
        crate: [ios-device-bridge, context-launcher]
    defaults:
      run:
        working-directory: apps/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/${{ matrix.crate }}
      - run: cargo test --locked
      # The launcher only ships for Windows, and no Windows runner checks every push, so its Windows code compiles here.
      - if: matrix.crate == 'context-launcher'
        run: rustup target add x86_64-pc-windows-gnu && cargo clippy --locked --target x86_64-pc-windows-gnu -- -D warnings

  # The packages declare swift-tools-version 6.4, which takes Xcode 27; macos-latest still carries 26.
  swift-pulsar:
    name: swift (RuimtePulsar)
    needs: changes
    if: ${{ !cancelled() && (inputs.full || needs.changes.outputs.swift_pulsar == 'true') }}
    runs-on: xcode-27
    defaults:
      run:
        working-directory: apps/ios/Packages/RuimtePulsar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test

  swift-transport:
    name: swift (RuimteTransport)
    needs: changes
    if: ${{ !cancelled() && (inputs.full || needs.changes.outputs.swift_transport == 'true') }}
    runs-on: xcode-27
    defaults:
      run:
        working-directory: apps/ios/Packages/RuimteTransport
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test

  # The same runner as the iOS packages, for the tests. `packaged` compiles the helper for release on
  # macos-latest, the runner the release itself builds on.
  computer-use:
    needs: changes
    if: ${{ !cancelled() && (inputs.full || needs.changes.outputs.computer_use == 'true') }}
    runs-on: xcode-27
    defaults:
      run:
        working-directory: apps/computer-use
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift build
      - run: swift test

  foundation-models:
    needs: changes
    if: ${{ !cancelled() && (inputs.full || needs.changes.outputs.foundation_models == 'true') }}
    runs-on: xcode-27
    defaults:
      run:
        working-directory: apps/foundation-models
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift build
      - run: swift test

  checks:
    name: CI checks
    if: ${{ always() }}
    needs:
      [
        changes,
        verify,
        typecheck,
        build,
        unit,
        windows,
        dom,
        integration,
        packaged,
        integration-linux,
        packaged-linux,
        rust,
        swift-pulsar,
        swift-transport,
        computer-use,
        foundation-models
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'all(.[]; . == "success" or . == "skipped")' <<< "$RESULTS"
