name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these jobs on the tagged commit, so a red one keeps the draft from being published.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run format:check
      - run: bun run build
      - run: bun run test

  integration:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The npm integration test compiles the daemon, and with it the Rust helpers and the Swift one.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/ios-device-bridge
            apps/speech-bridge
      - run: bun install --frozen-lockfile
      - run: bun run test:integration

  rust:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios-device-bridge
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/ios-device-bridge
      - run: cargo test --locked

  # The packages declare swift-tools-version 6.4, which takes Xcode 27; macos-latest still carries 26.
  swift:
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        package: [RuimtePulsar, RuimteTransport]
    defaults:
      run:
        working-directory: apps/ios/Packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - run: swift test

  # The same runner as the iOS packages, for the tests. `integration` compiles the helper for release on
  # macos-latest, the runner the release itself builds on.
  computer-use:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: apps/computer-use
    steps:
      - uses: actions/checkout@v5
      - run: swift build
      - run: swift test
