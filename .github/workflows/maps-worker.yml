name: Map service

# Starts once CI finished on main, so a red CI starts no runner and sends no mail of its own.
on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]

concurrency:
    group: maps-worker
    cancel-in-progress: false

jobs:
    gate:
        if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
            deployments: read
        outputs:
            deploy: ${{ steps.gate.outputs.deploy }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  fetch-depth: 0
            - id: gate
              uses: ./.github/actions/deploy-gate
              with:
                  environment: maps-worker
                  paths: |
                      .github/workflows/maps-worker.yml
                      apps/maps-worker
                      packages/pulsar
                      bun.lock

    deploy:
        needs: gate
        if: needs.gate.outputs.deploy == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            deployments: write
        # The API token only reaches the step that deploys, never the install, the typecheck or the tests.
        env:
            CLOUDFLARE_ACCOUNT_ID: 5e565cf9fa55b0eae1f8131903da2ca9
            SHA: ${{ github.event.workflow_run.head_sha }}
        defaults:
            run:
                working-directory: apps/maps-worker
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ env.SHA }}
            - uses: ./.github/actions/install
            - run: bun run typecheck
            - run: bun test
            - run: bun test
              working-directory: packages/pulsar
            # The service reports its errors and warnings under the commit it ships.
            - run: bun run deploy -- --var "OBSERVATORY_RELEASE:maps@${SHA::12}"
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            - run: curl --fail --silent --show-error --max-time 20 https://maps.ruimte.app/health
            - uses: ./.github/actions/deploy-record
              with:
                  environment: maps-worker
                  sha: ${{ env.SHA }}
