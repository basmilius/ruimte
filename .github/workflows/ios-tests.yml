name: iOS tests

# The iPhone app's own tests, once per release tag. A workflow of its own, so neither release.yml nor the ci.yml run
# a release is gated on waits for it; a red run here holds up no release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: ios (RuimteTests)
    # The packages declare swift-tools-version 6.4, which takes Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Identify the toolchain and a simulator
        id: setup
        run: |
          echo "DERIVED_DATA=$RUNNER_TEMP/ruimte-ios" >> "$GITHUB_ENV"
          echo "toolchain=$({ sw_vers -productVersion; xcodebuild -version; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          simulator=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "simulator=$simulator" >> "$GITHUB_OUTPUT"
      # Restore only: a tag can read main's cache from native.yml's ios-build, but no other tag reads what it saves.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DERIVED_DATA }}
          key: ios-derived-v1-${{ steps.setup.outputs.toolchain }}-${{ hashFiles('apps/ios/Ruimte.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ios-derived-v1-${{ steps.setup.outputs.toolchain }}-${{ hashFiles('apps/ios/Ruimte.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
      # SwiftTerm's shaders need it; an image that has it already answers with an error.
      - run: xcodebuild -downloadComponent MetalToolchain || xcrun -f metal
      # A hung test fails on its own after five minutes, under its own name, and the rest still run.
      - name: Test
        env:
          SIMULATOR: ${{ steps.setup.outputs.simulator }}
        run: |
          xcodebuild test -project apps/ios/Ruimte.xcodeproj -scheme Ruimte -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR" -derivedDataPath "$DERIVED_DATA" \
            -only-testing:RuimteTests -test-timeouts-enabled YES -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO
