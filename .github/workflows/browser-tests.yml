name: Browser tests

# Nightly on main, so a change that breaks the browser suite shows on main's checks within a day.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/cache-native-builds
      - uses: ./.github/actions/install
      # DIAG: temporary, removed once the runner is understood.
      - run: zsh --version; sw_vers; sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string; ls -la /etc/zshrc /etc/zshenv /etc/zprofile 2>&1 || true
      - run: bun run test:browser

  # The canvas's frame budgets, which depend on the runner. A miss marks this job and leaves the
  # run's result to the suite above; the numbers are in the log.
  perf:
    runs-on: macos-latest
    continue-on-error: true
    env:
      RUIMTE_CANVAS_BUDGET: '1'
      RUIMTE_CANVAS_REPORT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - run: bun run --cwd apps/client build
      - run: bun scripts/test-integration.ts --browser apps/client/src/canvas/canvas-pan-performance.browser.integration.test.ts
