name: npm

# Publishes the launcher and its platform binaries. Shared libraries release from Adecore.
# npm trusts this workflow through OIDC; existing versions are skipped on a retry.
on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            version:
                description: The release to publish, without the v (0.2.0); its tag has to exist
                required: true
            release_run:
                description: The release.yml run whose daemons to publish; without one this run compiles them
                required: false

permissions:
    contents: read

jobs:
    version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            ref: ${{ steps.version.outputs.ref }}
        steps:
            - id: version
              env:
                  TAG: ${{ github.event.release.tag_name || github.ref_name }}
                  INPUT: ${{ inputs.version }}
              run: |
                  version="${INPUT:-${TAG#v}}"
                  ref="v$version"
                  # Over the whole value: grep would pass a second line, which lands in GITHUB_OUTPUT.
                  pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
                  if [[ ! "$version" =~ $pattern ]]; then
                    echo "Not a version: $version" >&2
                    exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "ref=$ref" >> "$GITHUB_OUTPUT"

    # A macOS binary has to be re-signed with codesign after Bun writes it, or the kernel kills it on
    # launch, so the darwin targets build on macOS. Bun cross-compiles the Linux and Windows ones from
    # anywhere, and compile.ts fetches the Windows database helper at the version bun.lock pins.
    # A release run already compiled them, so only a publish without one builds them here.
    binaries:
        needs: version
        if: ${{ !inputs.release_run }}
        strategy:
            matrix:
                include:
                    - target: darwin-arm64
                      runner: macos-latest
                    - target: linux-x64
                      runner: ubuntu-latest
                    - target: linux-arm64
                      runner: ubuntu-latest
                    - target: win32-x64
                      runner: ubuntu-latest
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.version.outputs.ref }}
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json
            # A dispatch can rebuild a tag from before the cache action existed.
            - uses: ./.github/actions/cache-native-builds
              if: runner.os == 'macOS' && hashFiles('.github/actions/cache-native-builds/action.yml') != ''
            - run: bun install --frozen-lockfile
            - name: Compile the daemon
              env:
                  RUIMTE_VERSION: ${{ needs.version.outputs.version }}
                  RUIMTE_TELEMETRY: '1'
              run: bun apps/server/scripts/compile.ts --target ${{ matrix.target }} --outdir binaries/${{ matrix.target }}
            # A dispatch can rebuild a tag from before the action existed.
            - uses: ./.github/actions/daemon-source-map
              if: hashFiles('.github/actions/daemon-source-map/action.yml') != ''
              with:
                  map: binaries/${{ matrix.target }}.symbols/ruimte.map
                  token: ${{ secrets.OBSERVATORY_UPLOAD_TOKEN }}
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ matrix.target }}
                  path: binaries/${{ matrix.target }}
                  if-no-files-found: error
                  retention-days: 7

    publish:
        needs: [version, binaries]
        if: ${{ !cancelled() && needs.version.result == 'success' && (needs.binaries.result == 'success' || needs.binaries.result == 'skipped') }}
        runs-on: ubuntu-latest
        environment: npm
        permissions:
            contents: read
            id-token: write
            # Reads the artifacts of the release run.
            actions: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.version.outputs.ref }}
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
            # Trusted Publishing needs npm 11.5.1 or newer. Pinned, since this job holds the OIDC token npm publishes with.
            - run: npm install -g npm@11.20.0 && npm --version
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              if: ${{ !inputs.release_run }}
              with:
                  path: binaries
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              if: ${{ inputs.release_run }}
              with:
                  path: binaries
                  run-id: ${{ inputs.release_run }}
                  github-token: ${{ github.token }}
            # Windows ships only once the repository variable WINDOWS_RELEASE is `true`, the same one
            # release.yml reads, and only after @ruimte/win32-x64 trusts this workflow (docs/RELEASE.md).
            - name: Lay out the packages
              env:
                  VERSION: ${{ needs.version.outputs.version }}
                  WINDOWS_RELEASE: ${{ vars.WINDOWS_RELEASE }}
              run: |
                  skip=()
                  if [ "$WINDOWS_RELEASE" != true ]; then
                    skip=(--skip win32-x64)
                  fi
                  bun packages/npm/scripts/build.ts --version "$VERSION" --binaries binaries --out npm-packages "${skip[@]}"
            - name: Publish platform packages before the launcher
              run: bun packages/npm/scripts/publish.ts --out npm-packages
