name: Address book

# CI's `deploys` job starts this once main is green and the address book changed; a person can start it by hand too.
on:
    workflow_dispatch:
        inputs:
            sha:
                description: The commit to deploy; without one, the newest on main
                required: false

# One deploy at a time, so two pushes never apply migrations over each other.
concurrency:
    group: pulsar-worker
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            deployments: write
        # The API token only reaches the steps that deploy, never the install, the typecheck or the tests.
        env:
            CLOUDFLARE_ACCOUNT_ID: 5e565cf9fa55b0eae1f8131903da2ca9
            DEPLOY_SHA: ${{ inputs.sha || github.sha }}
        defaults:
            run:
                working-directory: apps/pulsar-worker
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ env.DEPLOY_SHA }}
            - uses: ./.github/actions/install
            - run: bun run typecheck
            - run: bun test
            - run: bun test
              working-directory: packages/pulsar
            - run: bun test scripts/deploy-pulsar-worker.test.ts
              working-directory: .
            # The script applies migrations, deploys, then spends its one-time benchmark refresh token.
            - run: bun run deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            - run: curl --fail --silent --show-error --max-time 20 https://pulsar.ruimte.app/health
            - uses: ./.github/actions/deploy-record
              with:
                  environment: pulsar-worker
                  sha: ${{ env.DEPLOY_SHA }}
