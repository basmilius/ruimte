name: Station

on:
  push:
    branches: [main]
    paths:
      - 'apps/station/**'
      - 'apps/client/**'
      - 'packages/**'
      - 'bun.lock'
      - '.github/workflows/station.yml'

# One deploy at a time, so an older build never lands after a newer one.
concurrency:
  group: station
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      CLOUDFLARE_ACCOUNT_ID: 5e565cf9fa55b0eae1f8131903da2ca9
    defaults:
      run:
        working-directory: apps/station
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - run: bun run typecheck
      - run: bun test
      - run: bun test src/station.test.ts src/pulsar src/transport/wake.test.ts
        working-directory: apps/client
      # A deploy is the station's release: it reports its errors under the commit it ships.
      - name: Build
        env:
          RUIMTE_TELEMETRY: '1'
        run: |
          export RUIMTE_VERSION="station-${GITHUB_SHA::12}"
          echo "RUIMTE_VERSION=$RUIMTE_VERSION" >> "$GITHUB_ENV"
          bun run build
      - uses: ./.github/actions/client-source-maps
        with:
          dist: apps/station/dist
          release: ruimte@${{ env.RUIMTE_VERSION }}
          token: ${{ secrets.OBSERVATORY_UPLOAD_TOKEN }}
      - uses: ./.github/actions/wait-for-ci
      - run: bunx wrangler deploy
        env:
          # The same token the address book deploys with: Workers Scripts Edit on the account, and on the zone
          # `ruimte.app` Workers Routes Edit and Zone Read, which the Custom Domain `station.ruimte.app` needs.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The page has to answer with its policy, or the deploy is not what this repository says it is.
      - run: curl --fail --silent --show-error --max-time 20 --head https://station.ruimte.app/ | grep -i '^content-security-policy:.*frame-ancestors'
      # The deploy only gives a release its commits, so a tracker that is down never fails it.
      - name: Report the deploy
        continue-on-error: true
        uses: basmilius/observatory-action@dae861d69a193baacbe35c29b9b99754f2938f10 # v1
        with:
          url: https://ingest.bmnw.nl
          token: ${{ secrets.OBSERVATORY_UPLOAD_TOKEN }}
          version: ruimte@${{ env.RUIMTE_VERSION }}
