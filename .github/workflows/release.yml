name: Release

# A tag `v1.2.3` builds the desktop app for macOS and Linux and uploads it to a draft GitHub release
# with the files electron-updater reads (`latest-mac.yml`, `latest-linux.yml`,
# `latest-linux-arm64.yml`). The notes come off the annotated tag. Once every build and the checks
# pass, the draft is published, which ships it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Two artifacts that finish at once both find no release and both create one. One of the races
  # loses, and its upload with it: v0.0.1 landed without the x64 zip that `latest-mac.yml` names.
  # With three builds in parallel the draft has to exist before any of them starts.
  draft:
    runs-on: ubuntu-latest
    steps:
      # Checkout writes a tag ref as a lightweight tag on the commit, and fetch-tags beside it
      # fails the fetch outright, so the annotated tag is fetched over it on its own.
      - uses: actions/checkout@v5
      - run: git fetch --force --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - name: The draft release, before anything uploads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          # An annotated tag carries the release notes; a lightweight one would hand back the commit
          # message, which is not what anyone wrote for the release. Nothing here may fail. Without a
          # draft the three builds race to create one and the loser's upload goes missing, so a tag
          # this cannot read leaves the notes empty and the release still gets made.
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME" 2>/dev/null)" = tag ]; then
              git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$notes"
          fi
          gh release create "$GITHUB_REF_NAME" --draft --title "Release ${GITHUB_REF_NAME#v}" --notes-file "$notes"

  # ci.yml on the tagged commit, alongside packaging. A red job keeps the release a draft.
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Version from the tag
        run: echo "RUIMTE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: bun run --cwd apps/client build
      - name: Compile the daemon
        run: bun run --cwd apps/server compile -- --os mac --arch arm64
      # notarytool reads the key from a file, so the secret becomes one for the length of the job.
      - name: The App Store Connect key on disk
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then exit 0; fi
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build and upload
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Notarization needs an App Store Connect key: the .p8 written above, its id and the issuer id.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # electron-builder imports the certificate into a keychain of its own for the length of the build.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          notarize=false
          if [ -n "$APPLE_API_KEY" ]; then notarize=true; fi
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          bun run build:main
          bun x electron-builder --mac --arm64 --publish always \
            -c.extraMetadata.version="$RUIMTE_VERSION" -c.mac.notarize=$notarize
      - name: Shred the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  linux:
    needs: draft
    strategy:
      matrix:
        include:
          # The runner sets the glibc floor for the daemon and Electron, and 24.04 would lock out
          # Debian 12 and Ubuntu 22.04.
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install rpmbuild when the runner lacks it
        run: |
          if ! command -v rpmbuild >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y rpm
          fi
      - run: bun install --frozen-lockfile
      - name: Version from the tag
        run: echo "RUIMTE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: bun run --cwd apps/client build
      - name: Compile the daemon
        run: bun run --cwd apps/server compile -- --os linux --arch ${{ matrix.arch }}
      # Every target goes up, AppImage included: the feed an install updates from has to name the
      # format it was installed from.
      - name: Build and upload
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run build:main
          bun x electron-builder --linux --${{ matrix.arch }} --publish always \
            -c.extraMetadata.version="$RUIMTE_VERSION"

  publish:
    needs: [verify, build, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false ;;
            *) gh release edit "$GITHUB_REF_NAME" --draft=false --latest ;;
          esac
      # A release published with GITHUB_TOKEN starts no workflow, so `release: published` never
      # reaches npm.yml from here; a dispatch is the one event that token may start.
      - name: Start the npm publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run npm.yml --ref main -f version="${GITHUB_REF_NAME#v}"
