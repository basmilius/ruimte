name: Release

# A tag `v1.2.3` builds the desktop app for macOS and Linux and uploads it to a draft GitHub release
# with the files electron-updater reads (`latest-mac.yml`, `latest-linux.yml`,
# `latest-linux-arm64.yml`). Publish the draft to ship.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Two artifacts that finish at once both find no release and both create one. One of the races
  # loses, and its upload with it: v0.0.1 landed without the x64 zip that `latest-mac.yml` names.
  # With three builds in parallel the draft has to exist before any of them starts.
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: The draft release, before anything uploads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" --draft --title "${GITHUB_REF_NAME#v}" --notes ''

  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test

  build:
    needs: draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Version from the tag
        run: echo "RUIMTE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: bun run --cwd apps/client build
      - name: Compile the daemon
        run: bun run --cwd apps/server compile -- --os mac --arch arm64
      # notarytool reads the key from a file, so the secret becomes one for the length of the job.
      - name: The App Store Connect key on disk
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then exit 0; fi
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      # electron-builder can import CSC_LINK itself, but it unlocks the keychain it just made with the
      # .p12 password instead of the keychain's own, and `security set-key-partition-list` refuses.
      # Building the keychain here and letting electron-builder discover the identity avoids that.
      - name: The Developer ID certificate in a keychain
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then exit 0; fi
          umask 077
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          # codesign only looks at the search list, so put ours in front of the ones already there.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"
          echo "RUIMTE_SIGN=1" >> "$GITHUB_ENV"
      - name: Build and upload
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Notarization needs an App Store Connect key: the .p8 written above, its id and the issuer id.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          notarize=false
          if [ -n "$APPLE_API_KEY" ]; then notarize=true; fi
          if [ -z "$RUIMTE_SIGN" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          bun run build:main
          bun x electron-builder --mac --arm64 --publish always \
            -c.extraMetadata.version="$RUIMTE_VERSION" -c.mac.notarize=$notarize
      - name: Shred the key and the keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

  # Verification runs alongside packaging. A failure leaves the release as a draft, so no artifact
  # is published before the commit has passed its checks.
  linux:
    needs: draft
    strategy:
      matrix:
        include:
          # The runner sets the glibc floor for the daemon and Electron, and 24.04 would lock out
          # Debian 12 and Ubuntu 22.04.
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install rpmbuild when the runner lacks it
        run: |
          if ! command -v rpmbuild >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y rpm
          fi
      - run: bun install --frozen-lockfile
      - name: Version from the tag
        run: echo "RUIMTE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: bun run --cwd apps/client build
      - name: Compile the daemon
        run: bun run --cwd apps/server compile -- --os linux --arch ${{ matrix.arch }}
      # Every target goes up, AppImage included: the feed an install updates from has to name the
      # format it was installed from.
      - name: Build and upload
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run build:main
          bun x electron-builder --linux --${{ matrix.arch }} --publish always \
            -c.extraMetadata.version="$RUIMTE_VERSION"
