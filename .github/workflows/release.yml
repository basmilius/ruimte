name: Release

# A tag `v1.2.3` builds the desktop app for macOS and uploads it to a draft GitHub release with the
# files electron-updater reads (`latest-mac.yml`). Publish the draft to ship.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Version from the tag
        run: echo "RUIMTE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: bun run check
      - run: bun test
      - run: bun run --cwd apps/client build
      - name: Compile the daemon for both architectures
        run: |
          bun run --cwd apps/server compile -- --os mac --arch arm64
          bun run --cwd apps/server compile -- --os mac --arch x64
      # notarytool reads the key from a file, so the secret becomes one for the length of the job.
      - name: The App Store Connect key on disk
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then exit 0; fi
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build and upload
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A Developer ID certificate as base64 .p12 plus its password; without them the build is unsigned.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarization needs an App Store Connect key: the .p8 written above, its id and the issuer id.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          notarize=false
          if [ -n "$APPLE_API_KEY" ]; then notarize=true; fi
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          bun run build:main
          bun x electron-builder --mac --arm64 --x64 --publish always \
            -c.extraMetadata.version="$RUIMTE_VERSION" -c.mac.notarize=$notarize
      - name: Shred the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
