name: Release

# A tag `v1.2.3` builds the desktop app for macOS and Linux and uploads it to a draft GitHub release
# with the files electron-updater reads (`latest-mac.yml`, `latest-linux.yml`). Publish the draft to ship.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Version from the tag
        run: echo "RUIMTE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: bun run check
      - run: bun test
      - run: bun run --cwd apps/client build
      - name: Compile the daemon for both architectures
        run: |
          bun run --cwd apps/server compile -- --os ${{ matrix.platform }} --arch arm64
          bun run --cwd apps/server compile -- --os ${{ matrix.platform }} --arch x64
      - name: Build and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A Developer ID certificate as base64 .p12 plus its password; without them the build is unsigned.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarization needs an Apple ID with an app-specific password and the team id.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          notarize=false
          if [ "${{ matrix.platform }}" = "mac" ] && [ -n "$APPLE_ID" ]; then notarize=true; fi
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          bun run --cwd apps/desktop build:main
          bun x --cwd apps/desktop electron-builder --${{ matrix.platform }} --arm64 --x64 --publish always \
            -c.extraMetadata.version="$RUIMTE_VERSION" -c.mac.notarize=$notarize
