name: Release

# A tag `v1.2.3` builds the desktop app for macOS and Linux and uploads it to a draft GitHub release
# with the files electron-updater reads (`latest-mac.yml`, `latest-linux.yml`,
# `latest-linux-arm64.yml`), and Windows with `latest.yml` once the repository variable
# WINDOWS_RELEASE is `true`. The notes come off the annotated tag. Once every build and the checks
# pass, the draft is published, which ships it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Two artifacts that finish at once both find no release and both create one. One of the races
  # loses, and its upload with it: v0.0.1 landed without the x64 zip that `latest-mac.yml` names.
  # With the builds in parallel the draft has to exist before any of them starts.
  draft:
    runs-on: ubuntu-latest
    steps:
      # Checkout writes a tag ref as a lightweight tag on the commit, and fetch-tags beside it
      # fails the fetch outright, so the annotated tag is fetched over it on its own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git fetch --force --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - name: The draft release, before anything uploads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          # An annotated tag carries the release notes; a lightweight one would hand back the commit
          # message, which is not what anyone wrote for the release. Nothing here may fail. Without a
          # draft the builds race to create one and the loser's upload goes missing, so a tag
          # this cannot read leaves the notes empty and the release still gets made.
          notes="$RUNNER_TEMP/notes.md"
          : > "$notes"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME" 2>/dev/null)" = tag ]; then
              git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$notes"
          fi
          gh release create "$GITHUB_REF_NAME" --draft --title "Release ${GITHUB_REF_NAME#v}" --notes-file "$notes"

  # ci.yml on the tagged commit, alongside packaging. A red job keeps the release a draft.
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      full: true
    permissions:
      contents: read

  # The client is the same bundle on every platform, so it is built once: one set of debug ids and
  # source maps under `ruimte@<version>`, matching the page every build ships.
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - name: Version from the tag
        run: echo "RUIMTE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # Only a release build reports crashes; every other build stays silent.
      - name: Build the client
        env:
          RUIMTE_TELEMETRY: '1'
        run: bun run --cwd apps/client build
      - uses: ./.github/actions/client-source-maps
        with:
          dist: apps/client/dist
          release: ruimte@${{ env.RUIMTE_VERSION }}
          token: ${{ secrets.OBSERVATORY_UPLOAD_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client
          path: apps/client/dist
          if-no-files-found: error
          retention-days: 7

  mac:
    needs: [draft, client]
    runs-on: macos-latest
    steps:
      # Without them the build goes out unsigned or unnotarized, which Squirrel refuses as an update
      # and Gatekeeper blocks as a download, so a missing one stops the release here and the draft
      # stays a draft.
      - name: The signing and notarization secrets are there
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=""
          if [ -z "$CSC_LINK" ]; then missing="$missing CSC_LINK"; fi
          if [ -z "$CSC_KEY_PASSWORD" ]; then missing="$missing CSC_KEY_PASSWORD"; fi
          if [ -z "$APPLE_API_KEY_P8" ]; then missing="$missing APPLE_API_KEY_P8"; fi
          if [ -z "$APPLE_API_KEY_ID" ]; then missing="$missing APPLE_API_KEY_ID"; fi
          if [ -z "$APPLE_API_ISSUER" ]; then missing="$missing APPLE_API_ISSUER"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing release secrets:$missing"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/cache-native-builds
      - uses: ./.github/actions/install
      - name: Version from the tag
        run: echo "RUIMTE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client
          path: apps/client/dist
      - name: Compile the daemon
        env:
          RUIMTE_TELEMETRY: '1'
        run: bun run --cwd apps/server compile -- --os mac --arch arm64
      - uses: ./.github/actions/daemon-source-map
        with:
          map: apps/server/dist/mac-arm64.symbols/ruimte.map
          token: ${{ secrets.OBSERVATORY_UPLOAD_TOKEN }}
      # npm.yml publishes this daemon as it is, so a release compiles each one once.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-arm64
          path: apps/server/dist/mac-arm64
          if-no-files-found: error
          retention-days: 7
      # notarytool reads the key from a file, so the secret becomes one for the length of the job.
      - name: The App Store Connect key on disk
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build and upload
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Notarization needs an App Store Connect key: the .p8 written above, its id and the issuer id.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # electron-builder imports the certificate into a keychain of its own for the length of the build.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          RUIMTE_TELEMETRY: '1'
        run: |
          bun run build:main
          bun x electron-builder --mac --arm64 --publish always \
            -c.extraMetadata.version="$RUIMTE_VERSION" -c.mac.notarize=true
      - name: Shred the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  linux:
    needs: [draft, client]
    strategy:
      matrix:
        include:
          # The runner sets the glibc floor for the daemon and Electron, and 24.04 would lock out
          # Debian 12 and Ubuntu 22.04.
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rpmbuild when the runner lacks it
        run: |
          if ! command -v rpmbuild >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y rpm
          fi
      - uses: ./.github/actions/install
      - name: Version from the tag
        run: echo "RUIMTE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client
          path: apps/client/dist
      - name: Compile the daemon
        env:
          RUIMTE_TELEMETRY: '1'
        run: bun run --cwd apps/server compile -- --os linux --arch ${{ matrix.arch }}
      - uses: ./.github/actions/daemon-source-map
        with:
          map: apps/server/dist/linux-${{ matrix.arch }}.symbols/ruimte.map
          token: ${{ secrets.OBSERVATORY_UPLOAD_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: apps/server/dist/linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
      # Every target goes up, AppImage included: the feed an install updates from has to name the
      # format it was installed from.
      - name: Build and upload
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUIMTE_TELEMETRY: '1'
        run: |
          bun run build:main
          bun x electron-builder --linux --${{ matrix.arch }} --publish always \
            -c.extraMetadata.version="$RUIMTE_VERSION"

  # Unsigned until Bas picks a code signing route (docs/RELEASE.md, "Windows"); the certificate goes in
  # here as WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD, or as a signing service's step before the build.
  # Off unless the repository variable WINDOWS_RELEASE is `true`, so it never holds up the others.
  # NSIS only builds on Windows; the daemon would cross-compile anywhere.
  windows:
    needs: [draft, client]
    if: vars.WINDOWS_RELEASE == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - name: Version from the tag
        run: echo "RUIMTE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client
          path: apps/client/dist
      - name: Compile the daemon
        env:
          RUIMTE_TELEMETRY: '1'
        run: bun run --cwd apps/server compile -- --os win --arch x64
      - uses: ./.github/actions/daemon-source-map
        with:
          map: apps/server/dist/win-x64.symbols/ruimte.map
          token: ${{ secrets.OBSERVATORY_UPLOAD_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win32-x64
          path: apps/server/dist/win-x64
          if-no-files-found: error
          retention-days: 7
      # The installer, its blockmap and `latest.yml` go up together: electron-updater reads the feed of
      # the NSIS target, and the zip rides along for whoever wants it without an installer.
      - name: Build and upload
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUIMTE_TELEMETRY: '1'
        run: |
          bun run build:main
          bun x electron-builder --win --x64 --publish always \
            -c.extraMetadata.version="$RUIMTE_VERSION"

  # The deploy of the release the daemon, the shell and the page report under, `ruimte@<version>`, once
  # it is published, so its commits run from the release before. Bun maps a stack trace of the daemon
  # back to the source inside the binary; the page's source maps go up from the client job and
  # Electron's symbols from the platform builds. Reports arrive without it as well, so an error tracker
  # that is down never holds up a release.
  error-tracking:
    needs: publish
    # A skipped Windows build upstream would otherwise skip this job too, published or not.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    env:
      OBSERVATORY_UPLOAD_TOKEN: ${{ secrets.OBSERVATORY_UPLOAD_TOKEN }}
    steps:
      - name: Version from the tag
        run: echo "RUIMTE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: No token, no deploy
        if: env.OBSERVATORY_UPLOAD_TOKEN == ''
        run: echo "::warning::OBSERVATORY_UPLOAD_TOKEN is empty; no deploy reported"
      - name: Report the deploy
        if: env.OBSERVATORY_UPLOAD_TOKEN != ''
        uses: basmilius/observatory-action@dae861d69a193baacbe35c29b9b99754f2938f10 # v1
        with:
          url: https://ingest.bmnw.nl
          token: ${{ env.OBSERVATORY_UPLOAD_TOKEN }}
          version: ruimte@${{ env.RUIMTE_VERSION }}

  publish:
    needs: [verify, mac, linux, windows]
    # A skipped Windows build (WINDOWS_RELEASE off) holds nothing up; a failed one keeps the draft a draft.
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.mac.result == 'success' && needs.linux.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Publish the draft
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # Latest only moves forward: a run of an older tag that finishes later, or runs again, would
        # otherwise take it back, and the updater and /download would hand out that older build.
        run: |
          version="${GITHUB_REF_NAME#v}"
          latest=false
          case "$version" in
            *-*) gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false ;;
            *)
              current=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
              newest=$(printf '%s\n%s\n' "${current#v}" "$version" | sort -V | tail -n 1)
              if [ "$newest" = "$version" ]; then latest=true; fi
              gh release edit "$GITHUB_REF_NAME" --draft=false --latest="$latest"
              ;;
          esac
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      # A release published with GITHUB_TOKEN starts no workflow, so `release: published` never
      # reaches npm.yml from here; a dispatch is the one event that token may start. It publishes the
      # daemons this run compiled.
      - name: Start the npm publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run npm.yml --ref main -f version="${GITHUB_REF_NAME#v}" -f release_run="$GITHUB_RUN_ID"
      # The web clients follow Latest only, so an older tag that finishes later never takes them back.
      - name: Start the station and bench deploys
        if: ${{ steps.published.outputs.latest == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run station.yml --ref main -f version="${GITHUB_REF_NAME#v}"
          gh workflow run bench.yml --ref main -f version="${GITHUB_REF_NAME#v}"
