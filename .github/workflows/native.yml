name: Native

# The Rust and Swift checks, which ci.yml runs only for the paths they cover and release.yml runs on every
# tagged commit, so a release never ships a helper whose tests were skipped on the commit it builds.
on:
  workflow_call:
    inputs:
      full:
        description: Run every native check, whatever paths changed
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    if: ${{ !inputs.full }}
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      swift_pulsar: ${{ steps.paths.outputs.RuimtePulsar }}
      swift_shared: ${{ steps.paths.outputs.RuimteShared }}
      swift_transport: ${{ steps.paths.outputs.RuimteTransport }}
      swift_voice: ${{ steps.paths.outputs.RuimteVoice }}
      swift_intelligent_ui: ${{ steps.paths.outputs.RuimteIntelligentUI }}
      computer_use: ${{ steps.paths.outputs.computer_use }}
      ios: ${{ steps.paths.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: paths
        with:
          # Git detection also works for fork PRs without pull-requests permission in callers.
          token: ''
          filters: |
            rust:
              - '.github/**'
              - 'apps/ios-device-bridge/**'
              - 'apps/speech-bridge/**'
            RuimtePulsar:
              - '.github/**'
              - 'apps/ios/Packages/RuimtePulsar/**'
            RuimteShared:
              - '.github/**'
              - 'apps/ios/Packages/RuimtePulsar/**'
              - 'apps/ios/Packages/RuimteShared/**'
            RuimteTransport:
              - '.github/**'
              - 'apps/ios/Packages/RuimtePulsar/**'
              - 'apps/ios/Packages/RuimteTransport/**'
            RuimteVoice:
              - '.github/**'
              - 'apps/ios/Packages/RuimtePulsar/**'
              - 'apps/ios/Packages/RuimteVoice/**'
            RuimteIntelligentUI:
              - '.github/**'
              - 'apps/ios/Packages/RuimtePulsar/**'
              - 'apps/ios/Packages/RuimteIntelligentUI/**'
            computer_use:
              - '.github/**'
              - 'apps/computer-use/**'
            ios:
              - '.github/workflows/native.yml'
              - 'apps/ios/**'

  rust:
    needs: changes
    if: ${{ !cancelled() && (inputs.full || needs.changes.outputs.rust == 'true') }}
    runs-on: macos-latest
    strategy:
      matrix:
        crate: [ios-device-bridge, speech-bridge]
    defaults:
      run:
        working-directory: apps/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/${{ matrix.crate }}
      - run: cargo test --locked
      # The crates deny an unsafe block without a SAFETY comment, which only clippy checks.
      - run: cargo clippy --locked --all-targets

  # The packages declare swift-tools-version 6.4, which takes Xcode 27; macos-latest still carries 26.
  swift-pulsar:
    name: swift (RuimtePulsar)
    needs: changes
    if: ${{ !cancelled() && (inputs.full || needs.changes.outputs.swift_pulsar == 'true') }}
    runs-on: xcode-27
    defaults:
      run:
        working-directory: apps/ios/Packages/RuimtePulsar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test

  swift-shared:
    name: swift (RuimteShared)
    needs: changes
    if: ${{ !cancelled() && (inputs.full || needs.changes.outputs.swift_shared == 'true') }}
    runs-on: xcode-27
    defaults:
      run:
        working-directory: apps/ios/Packages/RuimteShared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test

  swift-transport:
    name: swift (RuimteTransport)
    needs: changes
    if: ${{ !cancelled() && (inputs.full || needs.changes.outputs.swift_transport == 'true') }}
    runs-on: xcode-27
    defaults:
      run:
        working-directory: apps/ios/Packages/RuimteTransport
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test

  swift-voice:
    name: swift (RuimteVoice)
    needs: changes
    if: ${{ !cancelled() && (inputs.full || needs.changes.outputs.swift_voice == 'true') }}
    runs-on: xcode-27
    defaults:
      run:
        working-directory: apps/ios/Packages/RuimteVoice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test

  swift-intelligent-ui:
    name: swift (RuimteIntelligentUI)
    needs: changes
    if: ${{ !cancelled() && (inputs.full || needs.changes.outputs.swift_intelligent_ui == 'true') }}
    runs-on: xcode-27
    defaults:
      run:
        working-directory: apps/ios/Packages/RuimteIntelligentUI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test

  # The same runner as the iOS packages, for the tests. `packaged` in ci.yml compiles the helper for release
  # on macos-latest, the runner the release itself builds on.
  computer-use:
    needs: changes
    if: ${{ !cancelled() && (inputs.full || needs.changes.outputs.computer_use == 'true') }}
    runs-on: xcode-27
    defaults:
      run:
        working-directory: apps/computer-use
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift build
      - run: swift test

  # Xcode Cloud builds the app only from a release tag, so a contract change that breaks it shows here first. Only on a
  # change under apps/ios and only a build: the app's own tests take long on these runners, and a release, whose full
  # run would wait on this job, already has Xcode Cloud building the app from its tag.
  ios-build:
    name: ios (Ruimte)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ios == 'true' }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Identify the toolchain and a simulator
        id: setup
        run: |
          echo "DERIVED_DATA=$RUNNER_TEMP/ruimte-ios" >> "$GITHUB_ENV"
          echo "toolchain=$({ sw_vers -productVersion; xcodebuild -version; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          simulator=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "simulator=$simulator" >> "$GITHUB_OUTPUT"
      # The packages and what an earlier run built from them; a new commit saves its own, so the newest is restored.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DERIVED_DATA }}
          key: ios-derived-v1-${{ steps.setup.outputs.toolchain }}-${{ hashFiles('apps/ios/Ruimte.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ios-derived-v1-${{ steps.setup.outputs.toolchain }}-${{ hashFiles('apps/ios/Ruimte.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
      # SwiftTerm's shaders need it; an image that has it already answers with an error.
      - run: xcodebuild -downloadComponent MetalToolchain || xcrun -f metal
      - name: Build
        env:
          SIMULATOR: ${{ steps.setup.outputs.simulator }}
        run: |
          xcodebuild build-for-testing -project apps/ios/Ruimte.xcodeproj -scheme Ruimte -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR" -derivedDataPath "$DERIVED_DATA" CODE_SIGNING_ALLOWED=NO

  # One result for a caller to wait on: a skipped check passes only when this run left it to the paths.
  native:
    name: Native checks
    if: ${{ always() }}
    needs: [changes, rust, swift-pulsar, swift-shared, swift-transport, swift-voice, swift-intelligent-ui, computer-use, ios-build]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          FULL: ${{ inputs.full }}
          RESULTS: ${{ toJSON(needs.*.result) }}
          CHECKS: ${{ toJSON(needs) }}
        run: |
          if [ "$FULL" = true ]; then
            # The app's build never runs in a full run, so it is skipped there by design.
            jq -e 'del(.changes, .["ios-build"]) | all(.[]; .result == "success")' <<< "$CHECKS"
          else
            jq -e 'all(.[]; . == "success" or . == "skipped")' <<< "$RESULTS"
          fi
