name: Site

# CI's `deploys` job starts this once main is green and the site changed; a person can start it by hand too.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: The commit to deploy; without one, the newest on main
        required: false

# One deploy at a time, so an older build never lands after a newer one.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_ACCOUNT_ID: 5e565cf9fa55b0eae1f8131903da2ca9
      SHA: ${{ inputs.sha || github.sha }}
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - uses: ./.github/actions/install
      - run: bun run typecheck
      - run: bun test
      - run: bun run deploy
        env:
          # The token the station deploys with; the Custom Domains `ruimte.app` and `www.ruimte.app` sit on the same zone.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: ./.github/actions/deploy-record
        with:
          environment: site
          sha: ${{ env.SHA }}
