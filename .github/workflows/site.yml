name: Site

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'bun.lock'
      - '.github/workflows/site.yml'
  workflow_dispatch:

# One deploy at a time, so an older build never lands after a newer one.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 5e565cf9fa55b0eae1f8131903da2ca9
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run typecheck
      - run: bun test
      - run: bun run deploy
        env:
          # The token the station deploys with; the Custom Domains `ruimte.app` and `www.ruimte.app` sit on the same zone.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
