name: Client source maps
description: Give a release build of the client debug ids, upload its source maps for the crash reports, and take them out so none ships

inputs:
  dist:
    description: The folder the client was built into
    required: true
  release:
    description: The release they report under, `ruimte@<version>`
    required: true
  token:
    description: OBSERVATORY_UPLOAD_TOKEN; without it the maps are only removed
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: No token, no upload
      if: inputs.token == ''
      shell: bash
      run: echo "::warning::OBSERVATORY_UPLOAD_TOKEN is empty; the source maps of ${{ inputs.release }} were not uploaded"
    # A tracker that is down never holds up a release: its stack traces only stay minified.
    - name: Debug ids and the upload
      if: inputs.token != ''
      continue-on-error: true
      uses: basmilius/observatory-action@dae861d69a193baacbe35c29b9b99754f2938f10 # v1
      with:
        url: https://ingest.bmnw.nl
        token: ${{ inputs.token }}
        version: ${{ inputs.release }}
        sourcemaps: ${{ inputs.dist }}
        inject: 'true'
        deploy: 'false'
    - name: No source map ships
      shell: bash
      env:
        DIST: ${{ inputs.dist }}
      run: find "$DIST" -name '*.map' -delete
