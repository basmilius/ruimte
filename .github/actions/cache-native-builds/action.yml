name: Cache native builds
description: Share the macOS release helpers between CI, desktop releases and npm builds

runs:
  using: composite
  steps:
    - name: Identify the macOS toolchain
      id: toolchain
      shell: bash
      run: |
        toolchain=$(
          {
            sw_vers -productVersion
            xcodebuild -version
            swift --version
            xcrun --sdk macosx --show-sdk-version
          } | shasum -a 256 | cut -d ' ' -f 1
        )
        echo "key=$toolchain" >> "$GITHUB_OUTPUT"
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        shared-key: macos-release-${{ steps.toolchain.outputs.key }}
        cache-bin: false
        workspaces: |
          apps/ios-device-bridge
          apps/speech-bridge
    # Swift binaries are reused only when their sources and toolchain match exactly.
    - name: Cache Swift release products
      id: swift
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          apps/computer-use/.build
          apps/foundation-models/.build
        key: swift-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('apps/computer-use/Package.swift', 'apps/computer-use/Package.resolved', 'apps/computer-use/Sources/**', 'apps/computer-use/scripts/build.ts', 'apps/foundation-models/Package.swift', 'apps/foundation-models/Package.resolved', 'apps/foundation-models/Sources/**', 'apps/foundation-models/scripts/build.ts') }}
    - name: Use matching Swift release products
      shell: bash
      env:
        SWIFT_CACHE_HIT: ${{ steps.swift.outputs.cache-hit }}
      run: echo "RUIMTE_SWIFT_CACHE_HIT=$SWIFT_CACHE_HIT" >> "$GITHUB_ENV"
