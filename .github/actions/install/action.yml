name: Install
description: Set up the Bun of package.json and install the workspace

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: package.json
    - name: Install
      shell: bash
      run: bun install --frozen-lockfile
