name: Deploy gate
description: Decide whether a commit CI passed on ships a deploy, from what changed since that deploy last shipped and whether it is still the newest commit
# Runs after a checkout with `fetch-depth: 0`. The job needs `deployments: read`.

inputs:
  environment:
    description: The deployment environment that records what shipped, such as `site`
    required: true
  sha:
    description: The commit CI passed on
    required: true
  paths:
    description: The paths of this deploy, one pathspec per line, as `git diff` reads them
    required: true

outputs:
  deploy:
    description: '`true` when this commit ships'
    value: ${{ steps.gate.outputs.deploy }}

runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        SHA: ${{ inputs.sha }}
        ENVIRONMENT: ${{ inputs.environment }}
        PATHS: ${{ inputs.paths }}
      run: |
        # A newer commit on main has a CI run of its own that ships everything up to it, so an older run that
        # finishes late never lands over a newer deploy.
        tip=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
        if [ "$tip" != "$SHA" ]; then
          echo "::notice::$ENVIRONMENT: ${SHA::12} is no longer the newest commit on main; the run of ${tip::12} deploys."
          echo "deploy=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # An empty pathspec matches every file, so the blank line a YAML block ends with is left out.
        pathspecs=()
        while IFS= read -r line; do
          if [ -n "$line" ]; then
            pathspecs+=("$line")
          fi
        done <<< "$PATHS"

        # Compared with what shipped last, so commits pushed while CI was red ship with this one.
        base=$(gh api "repos/$GH_REPO/deployments?environment=$ENVIRONMENT&per_page=1" --jq '.[0].sha // empty')
        if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
          echo "::notice::$ENVIRONMENT: no earlier deploy is known, so ${SHA::12} ships."
          echo "deploy=true" >> "$GITHUB_OUTPUT"
        elif git diff --quiet "$base" "$SHA" -- "${pathspecs[@]}"; then
          echo "::notice::$ENVIRONMENT: nothing changed since ${base::12}."
          echo "deploy=false" >> "$GITHUB_OUTPUT"
        else
          echo "deploy=true" >> "$GITHUB_OUTPUT"
        fi
