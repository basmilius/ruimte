name: Electron symbols
description: Upload the breakpad symbols of the Electron the shell ships, so a minidump of the shell resolves to frames

inputs:
  platform:
    description: Electron's name for the platform, `darwin`, `linux` or `win32`
    required: true
  arch:
    description: '`x64` or `arm64`'
    required: true
  release:
    description: The release the shell reports under, `ruimte@<version>`
    required: true
  token:
    description: OBSERVATORY_UPLOAD_TOKEN; without it nothing is uploaded
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The shell has no native module of its own (`npmRebuild: false`), so Electron's symbols are all a minidump needs.
    # A failure only leaves a native crash with addresses.
    - name: Electron's symbols
      if: inputs.token != ''
      continue-on-error: true
      shell: bash
      working-directory: apps/desktop
      env:
        PLATFORM: ${{ inputs.platform }}
        ARCH: ${{ inputs.arch }}
      run: |
        version="$(node -p "require('electron/package.json').version")"
        curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/electron-symbols.zip" \
          "https://github.com/electron/electron/releases/download/v$version/electron-v$version-$PLATFORM-$ARCH-symbols.zip"
        unzip -q "$RUNNER_TEMP/electron-symbols.zip" -d "$GITHUB_WORKSPACE/electron-symbols"
        rm -f "$RUNNER_TEMP/electron-symbols.zip"
    - name: The upload
      if: inputs.token != ''
      continue-on-error: true
      uses: basmilius/observatory-action@dae861d69a193baacbe35c29b9b99754f2938f10 # v1
      with:
        url: https://ingest.bmnw.nl
        token: ${{ inputs.token }}
        version: ${{ inputs.release }}
        native-symbols: electron-symbols/**/*.sym
        deploy: 'false'
    - name: No symbols left behind
      if: always()
      shell: bash
      run: rm -rf "$GITHUB_WORKSPACE/electron-symbols"
