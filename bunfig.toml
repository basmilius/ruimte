[test]
# A test that needs a real shell, a file watcher, a network stack or the clock lives in a
# `*.integration.test.ts` file and runs with `bun run test:integration` (see integration.bunfig.toml).
pathIgnorePatterns = ["**/*.integration.test.ts"]
# The client's English words, so a pure function that reads one off i18next is testable
# without every test file initializing it first. The dedupe preload goes first and by path,
# since the root has no copy of the library under the isolated install.
preload = ["./apps/client/node_modules/@adecore/ui/src/testing/dedupe.ts", "./apps/client/test-preload.ts"]
