[test]
# The Windows job in CI, by Bas's choice: the files below boot a whole test daemon per test, which a
# Windows runner cannot do within Bun's five seconds, so they failed at random. They run on macOS and
# Linux in CI, and on Windows through `bun run test:windows` on a real machine (docs/WINDOWS.md).
pathIgnorePatterns = [
    "**/*.integration.test.ts",
    "**/*.dom.test.tsx",
    "**/docs/reports/**",
    "extensions/*/test/**",
    "extensions/poc/*/test/**",
    # Reads every source file, and says the same on every platform.
    "apps/client/src/project/view-nodes.test.ts",
    # These boot a whole test daemon per test, with the same result on a slow runner.
    "apps/server/src/tools/agent-fork.test.ts",
    "apps/server/src/tools/operation-tools.test.ts",
    "apps/server/src/chat/account.test.ts",
    "apps/server/src/chat/agent-images.test.ts",
    "apps/server/src/chat/fork.test.ts",
    "apps/server/src/chat/peer-config.test.ts",
    "apps/server/src/chat/summary.test.ts",
    "apps/server/src/chat/visuals.test.ts",
    "apps/server/src/context/deliver-message.test.ts",
    "apps/server/src/github/pr-watch-wiring.test.ts",
    "apps/server/src/outbox/end-children.test.ts",
    "apps/server/src/outbox/resume-run.test.ts",
    "apps/server/src/outbox/start-agent.test.ts",
    "apps/server/src/peering/peer-chat-start.test.ts",
    "apps/server/src/plans/plans.test.ts",
    "apps/server/src/projects/move-chat.test.ts",
    "apps/server/src/projects/move-repair.test.ts",
    "apps/server/src/remote/start-remote-agent.test.ts",
    "apps/server/src/tasks/cross-project.test.ts",
    "apps/server/src/tasks/give-task.test.ts",
    "apps/server/src/tasks/hidden-agents.test.ts",
    "apps/server/src/tasks/tasks.test.ts",
    "apps/server/src/voice/voice-daemon.test.ts",
    "apps/server/src/wiring/chat-move.test.ts",
]
