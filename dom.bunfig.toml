[test]
# Only for `bun run test:dom`, which runs the `*.dom.test.tsx` files the unit run leaves out. Those share one process, so a
# workspace one of them opened stays wired for the next; a `*.cold.test.tsx` runs after them in a page of its own, for a
# window that never opened one.
pathIgnorePatterns = ["**/*.integration.test.ts", "**/*.cold.test.tsx", "**/docs/reports/**", "extensions/*/test/**", "extensions/poc/*/test/**"]
# The page first: React DOM reads `document` once, as it loads, and the other two load it.
preload = ["./apps/client/testing/dom-preload.ts", "./apps/client/testing/react-compiler-preload.ts", "./apps/client/node_modules/@adecore/ui/src/testing/dedupe.ts", "./apps/client/test-preload.ts", "./scripts/no-process-preload.ts"]
