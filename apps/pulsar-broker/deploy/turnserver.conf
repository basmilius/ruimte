# coturn as the TURN relay for direct connections, on the broker's host. The broker hands out the
# credentials (TURN REST: `use-auth-secret`), so coturn and the broker read one secret file.
# Install: see apps/pulsar-broker/README.md. Replace PUBLIC_IP with the host's public address and
# turn.ruimte.app with the name you use. Copy to /etc/coturn/turnserver.conf; the drop-in in
# coturn.service.d adds the secret at start, so this file holds none.

# Answers on the public address; loopback is for turnutils_uclient on the host itself.
listening-ip=PUBLIC_IP
listening-ip=127.0.0.1
relay-ip=PUBLIC_IP
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=49999

realm=turn.ruimte.app
use-auth-secret
fingerprint
# Tells a client a nonce went stale after ten minutes, so a credential in use is checked again.
stale-nonce=600
no-software-attribute
no-cli
# The machines and clients use a public STUN server; this host relays and does nothing else.
no-stun
# Peers talk UDP; a TCP relay would only be a way to reach TCP services from here.
no-tcp-relay
no-multicast-peers
no-tlsv1
no-tlsv1_1

cert=/etc/coturn/certs/turn.ruimte.app.crt
pkey=/etc/coturn/certs/turn.ruimte.app.key

# One allocation per attempt, and a person rarely has more than a couple of machines up at once.
user-quota=4
total-quota=200
# Bytes per second: a session gets about 3 MB/s. coturn reserves that much out of the capacity for
# every allocation, used or not, and every attempt allocates on both ends, so the capacity counts
# allocations rather than traffic: 20 here. At 12 MB/s it was 4, which two attempts fill.
max-bps=3000000
bps-capacity=60000000

# A relay is not a way into anything private: every range that is not the public internet, and this
# host's own address, where the broker, the daemon and Caddy listen.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-239.255.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2001:db8::-2001:db8:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# The allocations live on this address too, so with it denied two peers that both need the relay cannot
# reach each other through it (403, measured with turnutils_uclient -y). `allowed-peer-ip=PUBLIC_IP`
# after this line would allow that, and with it UDP to anything else listening on this host.
denied-peer-ip=PUBLIC_IP

syslog
no-stdout-log
