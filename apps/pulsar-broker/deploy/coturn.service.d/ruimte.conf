# A drop-in for the distribution's coturn unit: /etc/systemd/system/coturn.service.d/ruimte.conf.
# coturn cannot read `static-auth-secret` from a file, and a flag would show the secret in the process
# list, so the start writes a copy of the config with the secret into a runtime directory only
# coturn can read. The secret file is shared with the broker through the ruimte-turn group.
[Service]
SupplementaryGroups=ruimte-turn
RuntimeDirectory=coturn
RuntimeDirectoryMode=0700
ExecStartPre=/bin/sh -c 'umask 077; { cat /etc/coturn/turnserver.conf; sed -n "1s/^/static-auth-secret=/p" /etc/ruimte/turn-secret; } > /run/coturn/turnserver.conf'
ExecStart=
ExecStart=/usr/bin/turnserver -c /run/coturn/turnserver.conf --pidfile=
Restart=always
RestartSec=2
MemoryMax=128M
LimitNOFILE=65536

# The same sandbox as the broker, with the one capability a port under 1024 would need left out: 3478 and 5349 need none.
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=true
LockPersonality=true
CapabilityBoundingSet=
