# A drop-in that lets the broker hand out TURN credentials for the coturn on the same host:
# /etc/systemd/system/pulsar-broker.service.d/turn.conf. It reads the secret coturn has, through the
# ruimte-turn group, and never sends it anywhere; a peer only ever gets a credential derived from it.
# Add the turns: URL once coturn has a certificate for the name.
[Service]
SupplementaryGroups=ruimte-turn
Environment=PULSAR_BROKER_TURN=shared-secret
Environment=PULSAR_BROKER_TURN_SECRET_FILE=/etc/ruimte/turn-secret
Environment=PULSAR_BROKER_TURN_URLS=turn:turn.ruimte.app:3478?transport=udp,turn:turn.ruimte.app:3478?transport=tcp
