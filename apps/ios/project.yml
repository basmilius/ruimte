name: Ruimte
fileGroups: [Configuration]
options:
  minimumXcodeGenVersion: 2.44.0
  developmentLanguage: en
  deploymentTarget:
    iOS: '27.0'
  createIntermediateGroups: true
packages:
  LucideSwift:
    url: https://github.com/ajaxjiang96/lucide-swift.git
    exactVersion: 0.9.5
  Highlightr:
    url: https://github.com/raspu/Highlightr.git
    exactVersion: 2.3.0
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.15.0
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    exactVersion: 9.30.2
  RuimtePulsar:
    path: Packages/RuimtePulsar
  RuimteTransport:
    path: Packages/RuimteTransport
  RuimteIntelligentUI:
    path: Packages/RuimteIntelligentUI
  RuimteVoice:
    path: Packages/RuimteVoice
configFiles:
  Debug: Configuration/Build.xcconfig
  Release: Configuration/Build.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    VERSIONING_SYSTEM: apple-generic
    IPHONEOS_DEPLOYMENT_TARGET: '27.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  Ruimte:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: ../../assets/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: LucideSwift
      - package: RuimtePulsar
      - package: RuimteTransport
      - package: RuimteIntelligentUI
      - package: RuimteVoice
      - package: SwiftTerm
      - package: Highlightr
      - package: Sentry
        product: Sentry
      - target: RuimteNotificationService
        embed: true
      - target: RuimteActivityWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ruimte.mobile
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Ruimte.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Ruimte
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
      configs:
        Debug:
          PUSH_ENVIRONMENT: development
          # Voice's microphone is in Debug builds only until its use is decided; Release declares none, which
          # MicrophoneDeclarationTests and the build phase below hold.
          INFOPLIST_KEY_NSMicrophoneUsageDescription: Ruimte uses the microphone while you talk to Voice. The audio goes to OpenAI only during the conversation.
        Release:
          PUSH_ENVIRONMENT: production
    postBuildScripts:
      - name: Release declares no microphone
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        outputFiles:
          - $(DERIVED_FILE_DIR)/microphone-declaration.checked
        script: |
          if [ "$CONFIGURATION" = "Release" ] && /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$TARGET_BUILD_DIR/$INFOPLIST_PATH" >/dev/null 2>&1; then
              echo "error: This Release build declares the microphone. Voice's microphone stays in Debug builds until its use is decided."
              exit 1
          fi
          touch "$DERIVED_FILE_DIR/microphone-declaration.checked"
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RuimtePushKeychainGroup: $(AppIdentifierPrefix)app.ruimte.mobile.push
        UIBackgroundModes: [audio, remote-notification, fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.ruimte.mobile.usage-widget]
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Ruimte uses the camera when you take a photo to attach to a message.
        NSLocalNetworkUsageDescription: Connect directly to your machines on the same Wi-Fi network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: app.ruimte.mobile.pulsar
            CFBundleURLSchemes: [ruimte]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  RuimteNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/NotificationService
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: RuimtePulsar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ruimte.mobile.notifications
        CODE_SIGN_ENTITLEMENTS: Extensions/NotificationService/NotificationService.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Extensions/NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Ruimte Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RuimtePushKeychainGroup: $(AppIdentifierPrefix)app.ruimte.mobile.push
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  RuimteActivityWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ActivityWidget
      - path: Shared
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: LucideSwift
      - package: RuimtePulsar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ruimte.mobile.activity
        CODE_SIGN_ENTITLEMENTS: Extensions/ActivityWidget/ActivityWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Extensions/ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: Ruimte Activity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  RuimteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Ruimte
      - package: LucideSwift
      - package: RuimtePulsar
      - package: RuimteTransport
      - package: RuimteVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ruimte.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
  RuimteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Ruimte
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ruimte.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Ruimte
schemes:
  Ruimte:
    build:
      targets:
        Ruimte: all
    test:
      targets: [RuimteTests]
  RuimteDeviceChecks:
    build:
      targets:
        Ruimte: all
        RuimteUITests: [test]
    test:
      targets: [RuimteUITests]
