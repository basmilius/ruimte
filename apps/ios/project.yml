name: Ruimte
fileGroups: [Configuration]
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
packages:
  LucideSwift:
    url: https://github.com/ajaxjiang96/lucide-swift.git
    exactVersion: 0.9.5
  Highlightr:
    url: https://github.com/raspu/Highlightr.git
    exactVersion: 2.3.0
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.15.0
  RuimtePulsar:
    path: Packages/RuimtePulsar
  RuimteTransport:
    path: Packages/RuimteTransport
configFiles:
  Debug: Configuration/Build.xcconfig
  Release: Configuration/Build.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    VERSIONING_SYSTEM: apple-generic
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
targets:
  Ruimte:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../../assets/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: LucideSwift
      - package: RuimtePulsar
      - package: RuimteTransport
      - package: SwiftTerm
      - package: Highlightr
      - target: RuimteNotificationService
        embed: true
      - target: RuimteActivityWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ruimte.mobile
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Ruimte.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Ruimte
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
      configs:
        Debug:
          PUSH_ENVIRONMENT: development
        Release:
          PUSH_ENVIRONMENT: production
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RuimtePushKeychainGroup: $(AppIdentifierPrefix)app.ruimte.mobile.push
        UIBackgroundModes: [remote-notification]
        NSSupportsLiveActivities: true
        NSLocalNetworkUsageDescription: Connect directly to your machines on the same Wi-Fi network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        CFBundleURLTypes:
          - CFBundleURLName: app.ruimte.mobile.pulsar
            CFBundleURLSchemes: [ruimte]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  RuimteNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/NotificationService
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: RuimtePulsar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ruimte.mobile.notifications
        CODE_SIGN_ENTITLEMENTS: Extensions/NotificationService/NotificationService.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Extensions/NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Ruimte Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RuimtePushKeychainGroup: $(AppIdentifierPrefix)app.ruimte.mobile.push
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  RuimteActivityWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ActivityWidget
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: LucideSwift
      - package: RuimtePulsar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ruimte.mobile.activity
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Extensions/ActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: Ruimte Activity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  RuimteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Ruimte
      - package: LucideSwift
      - package: RuimtePulsar
      - package: RuimteTransport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ruimte.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
  RuimteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Ruimte
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ruimte.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Ruimte
schemes:
  Ruimte:
    build:
      targets:
        Ruimte: all
    test:
      targets: [RuimteTests]
  RuimteDeviceChecks:
    build:
      targets:
        Ruimte: all
        RuimteUITests: [test]
    test:
      targets: [RuimteUITests]
