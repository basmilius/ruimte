[package]
name = "ios-device-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
block2 = "0.6.2"
clap = { version = "4", features = ["derive"] }
idevice = { version = "0.1.68", default-features = false, features = ["ring", "usbmuxd", "core_device_proxy", "display_stream", "tcp", "tunnel_tcp_stack"] }
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
