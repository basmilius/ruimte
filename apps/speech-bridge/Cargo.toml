[package]
name = "speech-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep CoreML available for testing; production loading uses CPU until the native compiler crash is resolved.
[target.'cfg(target_os = "macos")'.dependencies]
parakeet-rs = { version = "0.3", features = ["coreml"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
parakeet-rs = { version = "0.3" }

[profile.release]
opt-level = 3
