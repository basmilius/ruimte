<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!--
        The policy the app window runs under. The daemon sends the same one as a header on the
        client it serves (`apps/server/src/daemon.ts`); this tag is what covers the Vite dev server.
        `connect-src` is wide because a paired endpoint is any host the person adds, and the images,
        attachments and file bytes come from that same host.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' ws: wss: http: https:; worker-src 'self' blob:" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Ruimte</title>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
