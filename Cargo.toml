[workspace]
members = [
    "apps/server-rust",
    "crates/ruimte_ios_bridge",
    "crates/ruimte_browser",
    "crates/ruimte_cli",
    "crates/ruimte_core",
    "crates/ruimte_devices",
    "crates/ruimte_identity",
    "crates/ruimte_runtime",
    "crates/ruimte_schema",
    "crates/ruimte_usage",
    "crates/ruimte_workspace",
]
default-members = ["apps/server-rust", "crates/ruimte_cli"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
aes-gcm = "0.11.1"
alacritty_terminal = "0.26"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
futures-util = "0.3"
hkdf = "0.12"
hmac = "0.12"
http = "1"
jsonschema = { version = "0.33", default-features = false }
libc = "0.2"
mime_guess = "2"
notify = "8"
portable-pty = "0.9"
perfect_freehand = "0.1.1"
percent-encoding = "2"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rtc = "0.20.5"
roughr = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
webrtc = "0.20.5"
x25519-dalek = { version = "3", features = ["static_secrets"] }

[patch.crates-io]
alacritty_terminal = { path = "apps/server-rust/vendor/alacritty_terminal" }
